<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Professor Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#">Campus Help Desk</a>
      <div>
        <button id="logoutBtn" class="btn btn-light">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <h4>Assigned Tickets (Demo)</h4>
    <div id="assignedList">Loading...</div>
  </div>

<script>
  const token = localStorage.getItem('token');
  const role = localStorage.getItem('role');
  if (!token || role !== 'professor') {
    alert('Please login as professor');
    location.href = 'views/login.html';
  }

  document.getElementById('logoutBtn').addEventListener('click', ()=>{ localStorage.clear(); location.href='views/login.html'; });

  async function loadAssigned() {
    // Demo: fetch all tickets and filter by assigned_professor_id if implemented
    const res = await fetch('/api/queries/all');
    const data = await res.json();
    const container = document.getElementById('assignedList');
    if (!data || data.length === 0) {
      container.innerHTML = '<p>No tickets</p>';
      return;
    }
    container.innerHTML = data.map(q=>`
      <div class="card mb-2">
        <div class="card-body">
          <strong>${q.ticket_id}</strong> <span class="badge bg-secondary">${q.status}</span>
          <p>${q.subject}</p>
          <small>${new Date(q.created_at).toLocaleString()}</small>
        </div>
      </div>
    `).join('');
  }

  loadAssigned();
</script>
</body>
</html>
