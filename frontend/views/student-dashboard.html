<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Student Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#">Campus Help Desk</a>
      <div>
        <button id="logoutBtn" class="btn btn-light">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-6">
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <h5>Submit New Ticket</h5>
            <form id="ticketForm">
              <div class="mb-3">
                <label class="form-label">Subject</label>
                <input id="subject" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea id="description" class="form-control" rows="4" required></textarea>
              </div>
              <button class="btn btn-primary">Submit Ticket</button>
            </form>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <h5>My Tickets</h5>
            <div id="ticketsList">Loading...</div>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5>How it works</h5>
            <ol>
              <li>Submit ticket</li>
              <li>Professor receives and resolves or forwards</li>
              <li>You get email/SMS updates</li>
            </ol>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const token = localStorage.getItem('token');
  const role = localStorage.getItem('role');
  const userId = localStorage.getItem('userId');
  if (!token || role !== 'student') {
    alert('Please login as student');
    location.href = 'views/login.html';
  }

  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    localStorage.clear();
    location.href = 'views/login.html';
  });

  async function loadTickets() {
    const studentId = userId || 1;
    const res = await fetch(`/api/queries/student/${studentId}`);
    const data = await res.json();
    const container = document.getElementById('ticketsList');
    if (!data || data.length === 0) {
      container.innerHTML = '<p>No tickets yet</p>';
      return;
    }
    container.innerHTML = data.map(q=>`
      <div class="card mb-2">
        <div class="card-body">
          <strong>${q.ticket_id}</strong> <span class="badge bg-secondary">${q.status}</span>
          <p>${q.subject}</p>
          <small>${new Date(q.created_at).toLocaleString()}</small>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('ticketForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const subject = document.getElementById('subject').value;
    const description = document.getElementById('description').value;
    const studentId = userId || 1;
    const res = await fetch('/api/queries/submit', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ studentId, subject, description })
    });
    const data = await res.json();
    if (res.ok) {
      alert('Ticket created: ' + data.ticket_id);
      loadTickets();
    } else {
      alert(data.error || 'Error creating ticket');
    }
  });

  loadTickets();
</script>
</body>
</html>
